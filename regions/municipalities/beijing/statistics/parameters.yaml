- id: injury_death_benefits
  name: 因工死亡待遇构成（《工伤保险条例》第39条）
  authority: 国务院
  source_url: regions/national/regulations/administrative-regulations/工伤保险条例.md
  entries:
  - item: 丧葬补助金
    formula: 统筹地区上年度职工月平均工资 × 6
  - item: 一次性工亡补助金
    formula: 上年度全国城镇居民人均可支配收入 × 20
  - item: 供养亲属抚恤金
    formula: 本人工资 × 配偶 40% / 其他亲属每人 30%（孤寡老人或孤儿每人再加 10%），各供养亲属合计不超过本人工资
  gaps:
  - 「上年度全国城镇居民人均可支配收入」序列尚未归档（来源：国家统计局年度统计公报），计算时需显式传入并注明来源
decisions:
- id: economic_compensation_cap_basis
  title: 经济补偿三倍封顶基数口径
  rule: 封顶基数 = 上年度北京市法人单位从业人员平均工资 × 3；月工资高于该基数的，按封顶基数计算且补偿年限最高 12 年（《劳动合同法》第四十七条）
  effective_from: '2019-08-16'
  source_url: https://rsj.beijing.gov.cn/xxgk/tzgg/201912/t20191207_951033.html
  note: 2019 年 8 月 16 日前按原「北京市职工年平均工资」口径；人社局与统计局原联合发布职工平均工资的做法已终止
- id: economic_compensation_tax_exemption
  title: 经济补偿个税免税额度基数
  rule: 一次性补偿收入在当地上年职工平均工资 3 倍数额以内的部分免征个人所得税
  legal_basis: 财税〔2001〕157 号第一条
  note: 北京 2019 年前按「职工年平均工资」；口径切换后需以税务/统计局公布口径复核
- id: injury_wage_base
  title: 工伤待遇中「本市上年度职工月平均工资」的取值序列
  status: pending-official-confirmation
  rule: 京人社工发〔2011〕384号等文件仅表述为「本市上年度职工月平均工资」，未指明采用哪一组统计序列
  candidates:
  - series: beijing_full_caliber_avg_wage
    note: 人社局发布的社保经办口径，社保系统常用
  - series: beijing_legal_entity_avg_wage
    note: 统计局法人单位口径，经济补偿封顶使用
  note: 计算时**必须显式选择序列**并输出提示；正式出具意见前建议向社保经办机构/12333 确认本地口径
