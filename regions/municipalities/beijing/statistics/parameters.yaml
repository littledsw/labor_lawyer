- id: injury_death_benefits
  name: 因工死亡待遇构成（《工伤保险条例》第39条）
  authority: 国务院
  source_url: regions/national/regulations/administrative-regulations/工伤保险条例.md
  entries:
  - item: 丧葬补助金
    formula: 统筹地区上年度职工月平均工资 × 6
  - item: 一次性工亡补助金
    formula: 上年度全国城镇居民人均可支配收入 × 20
  - item: 供养亲属抚恤金
    formula: 本人工资 × 配偶 40% / 其他亲属每人 30%（孤寡老人或孤儿每人再加 10%），各供养亲属合计不超过本人工资
