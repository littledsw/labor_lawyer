decisions:
- id: economic_compensation_cap_basis
  title: 经济补偿三倍封顶基数口径
  rule: 封顶基数 = 上年度北京市法人单位从业人员平均工资 × 3；月工资高于该基数的，按封顶基数计算且补偿年限最高 12 年（《劳动合同法》第四十七条）
  effective_from: '2019-08-16'
  source_url: https://rsj.beijing.gov.cn/xxgk/tzgg/201912/t20191207_951033.html
  note: 2019 年 8 月 16 日前按原「北京市职工年平均工资」口径；人社局与统计局原联合发布职工平均工资的做法已终止
  evidence_chain:
  - 北京市人力资源和社会保障局《关于按照法人单位从业人员平均工资计算经济补偿封顶基数的通告》（2019-08-16，载 2018 年数值 127107 元/年）
  - 北京市人力资源和社会保障局《关于经济补偿封顶基数的通告》（2020-07-02）：口径不变，数值由统计部门发布，指引到统计局网站查询
  - 北京市统计局统计咨询答复（2024/2025 年度）：统计局公开序列为城镇非私营/私营单位；劳动工资年度数据约每年 6 月上传「统计部门发布计划」栏目
  data_location_unverified: 统计局官网「统计数据 → 统计部门发布计划」栏目（每年 6 月），需人工或电话核实后入库
- id: economic_compensation_tax_exemption
  title: 经济补偿个税免税额度基数
  rule: 一次性补偿收入在当地上年职工平均工资 3 倍数额以内的部分免征个人所得税
  legal_basis: 财税〔2001〕157 号第一条
  note: 北京 2019 年前按「职工年平均工资」；口径切换后需以税务/统计局公布口径复核
- id: unemployment_benefit_months_over_5y
  title: 失业保险金计发月数在「累计缴费 5 年以上」段的起算口径
  rule: 《北京市失业保险规定》第十七条第（五）项仅表述「按每满一年增发一个月失业保险金的办法计算，确定增发的月数」，未给出增发的起算基数。本表通过（采用值）：月数 = 12（对应「4 年以上不满 5 年」档） + （满整年数 − 4），24 个月封顶（即满 16 年达到封顶）
  candidates:
  - id: base_12_plus_one_per_year
    rule: 12 +（满整年数 − 4），封顶 24
    note: 与 1—5 年段「每满 1 年 3 个月」的档位（4—5 年 = 12 个月）衔接；采用值
  - id: years_times_3_continued
    rule: 满整年数 × 3，封顶 24
    note: 若把「增发」理解为延续 1—5 年段每年 3 个月的口径
  status: pending-official-confirmation
  source_url: https://www.beijing.gov.cn/zhengce/zhengcefagui/201905/t20190522_56688.html
  note: 官方页面（首都之窗失业保险金热点问答、海淀/门头沟问答）均只复述条文，未给算例；计算侧命中时输出待核实提示，正式文书前向 12333 或经办机构确认
- id: maternity_benefit_days
  title: 生育津贴计发天数（是否含生育奖励假）
  rule: 京人社医发〔2011〕334号第三条只写「按职工所在用人单位月缴费平均工资除以 30 天再乘以产假天数计发」，未列明天数。北京实务中同时存在 98 天（国家产假）与 128 天（98 天 + 30 天生育奖励假）两种口径，且各期政策不同
  candidates:
  - id: '98'
    days: 98
    note: 《女职工劳动保护特别规定》第七条国家产假天数
  - id: '128'
    days: 128
    note: 98 天产假 + 30 天生育奖励假；见于经办实务与媒体解读，未定位到官方原文页，须核实
  status: pending-official-confirmation
  source_url: https://www.beijing.gov.cn/zhengce/zhengcefagui/201905/t20190522_56936.html
  note: 计算侧要求调用方显式传入计发天数，不设默认值；《北京市企业职工生育保险规定》（2005 年市政府令第 154 号）原文尚未归档
- id: injury_wage_base
  title: 工伤待遇中「本市上年度职工月平均工资」的取值序列
  status: pending-official-confirmation
  rule: 京人社工发〔2011〕384号等文件仅表述为「本市上年度职工月平均工资」，未指明采用哪一组统计序列
  candidates:
  - series: beijing_full_caliber_avg_wage
    note: 人社局发布的社保经办口径，社保系统常用
  - series: beijing_legal_entity_avg_wage
    note: 统计局法人单位口径，经济补偿封顶使用
  note: 计算时**必须显式选择序列**并输出提示；正式出具意见前建议向社保经办机构/12333 确认本地口径
