decisions:
- id: shanxi_social_insurance_base_caliber
  title: 山西社保缴费基数的社平工资口径切换
  effective_from: '2019-01-01'
  rule: 2019 年 1 月 1 日前，按上年度全省「城镇非私营单位在岗职工平均工资」的 60%—300% 核定缴费基数上下限；自 2019 年 1 月 1 日起，改按「全口径城镇单位就业人员平均工资」（城镇非私营与城镇私营加权）的 60%—300% 核定。
  legal_basis: 国办发〔2019〕13 号《降低社会保险费率综合方案》；晋政办发〔2019〕26 号《山西省人民政府办公厅关于印发山西省降低社会保险费率实施方案的通知》
  note: 因口径切换，跨 2019 年的补缴需分段适用不同的社平工资序列，不能用一个基数贯穿。官方 2026 年基数通知本身即引用晋政办发〔2019〕26 号，可作为口径链条的第一环。
- id: shanxi_pension_rates
  title: 山西企业职工基本养老保险缴费比例
  effective_from: '2019-05-01'
  rule: 单位 16%、个人 8%。2019 年 5 月 1 日前单位比例为 20%。
  legal_basis: 国办发〔2019〕13 号；晋政办发〔2019〕26 号（**该文件原文尚未归档，待补**）
  status: pending-official-confirmation
  note: 单位 20%→16% 的适用时点、以及医疗/失业/工伤/生育各险种的单位与个人费率，均未见官方原文归档；测算时按 20%（2005—2019.4）与 16%（2019.5 起）区间使用，需经办机构确认。
- id: shanxi_backpayment_lookback
  title: 山西社保历史欠费补缴的可追溯年限与经办口径
  status: pending-official-confirmation
  rule: 未检索到山西省关于用人单位历史欠费补缴可追溯年限的公开文件。全国层面：《社会保险费征缴暂行条例》《社会保险稽核办法》均未对清缴企业欠费设追诉期；《劳动保障监察条例》第 20 条的 2 年为行政执法时效，社保欠缴有连续状态的自行终了之日起算。
  evidence_chain:
  - 人社部《人社建字〔2017〕105 号》答复：地方经办机构追缴历史欠费并未限定追诉期；经办机构接到超过 2 年追诉期的投诉，一般也按程序受理
  - 《最高人民法院行政法官专业会议纪要（七）》：不得仅以《劳动保障监察条例》第 20 条 2 年为由不再查处
  - 《实施〈中华人民共和国社会保险法〉若干规定》（人社部令第 13 号）第 29 条：2011-07-01 后的按社会保险法执行；**之前的按地方人民政府有关规定执行**
  note: 「2011-07-01 之前」这一段是否可补缴，取决于山西地方规定，必须到经办机构书面问询；**该答复同时决定后续走「补缴」还是「赔偿损失」两条完全不同的路径**，是本案最关键的未知项。
gaps:
- '**2005—2013 各年度全省在岗职工年平均工资 / 缴费基数上下限：未取得官方来源。**省人社厅「通知公告」栏目只保留现行年度通知（历年通知已下线）；省统计局「统计数据/数据信息」只列最新年份；中国统计年鉴在线版为 JS 渲染页，纯 HTTP 抓取不可用。取数路径：省统计年鉴纸质/PDF 版；或向属地社保经办机构、市人社局调取历年基数文件。'
- '**晋政办发〔2019〕26 号（山西省降低社会保险费率实施方案）原文未归档**——它是山西养老单位 20%→16% 的费率依据，需补齐。'
- '**山西省关于用人单位历史欠费补缴可追溯年限的公开文件未检索到**（见 decisions.shanxi_backpayment_lookback）。'
- '**山西省裁审口径未归档**：确认劳动关系是否适用仲裁时效、养老保险待遇损失赔偿如何计算，均未检索到山西高院/山西省人社厅的公开解答。'
- '**各险种单位费率的市级差异未取得**（医疗/失业/工伤/生育）——各市费率不尽相同，测算时按「其他四险合计约 10%」笼统替代，误差直接进金额；须向属地经办机构核实当年费率。'
