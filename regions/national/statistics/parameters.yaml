decisions:
- id: makeup_workday_overtime_basis
  title: 调休上班日（补班日）的加班费定性
  status: pending-official-confirmation
  rule: 现行文件只规定加班费倍数（劳动法第 44 条）与「假期内各日」的倍数分段（人社厅函〔2020〕135号），均未规定国办统一放假调休所形成的「调休上班日」应按工作日处理（只有延时部分 150%）还是按休息日处理（不能补休 200%）。
  options:
  - value: workday
    note: 视为工作日：当天正常工时按正常工资计，仅超出标准工作时间的部分按 150%。（现行计算实现默认）
  - value: rest_day
    note: 视为休息日：当天出勤应安排同等时间补休，不能补休的按 200% 支付。
  adopted: workday
  adopted_reason: 国办年度通知已将该日调整为上班日；且与之对调的假期内休息日（如 2025-10-07、10-08）已按人社厅函〔2020〕135号 的分段口径按 200% 计。该理由为通行理解，非官方原文。
  evidence_chain:
  - 《全国年节及纪念日放假办法》第七条：仅授权「合理安排统一放假调休」，未规定补班日定性
  - 人社厅函〔2020〕135号：仅界定假期内 10 月 1—4 日 300%、10 月 5—8 日 200%，未涉及补班日
  - 归档的 94 篇单篇典型案例与 80 条年度十大案例合集中，无一篇涉及补班日的加班费定性
  note: 正式出具意见前，建议向人社部门/12333 或经办法院确认本地口径；计算书须输出「待核实」提示。
